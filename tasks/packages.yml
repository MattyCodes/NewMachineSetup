---
- name: Install Homebrew formulae
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    state: present

- name: Install Homebrew casks
  community.general.homebrew_cask:
    name: "{{ item }}"
    state: present
    greedy: true
  loop: "{{ homebrew_casks }}"
  register: cask_install
  # Some casks (e.g. an app already installed by hand, outside Homebrew)
  # report a non-fatal error to that effect; treat only those as OK.
  failed_when:
    - cask_install is failed
    - "'already installed' not in (cask_install.msg | default(''))"
    - "'there is already an App at' not in (cask_install.msg | default(''))"
