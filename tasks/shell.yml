---
- name: Deploy ~/.bash_profile
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/bash_profile"
    dest: "{{ ansible_facts.env.HOME }}/.bash_profile"
    mode: "0644"
    backup: true

- name: Create an empty ~/.secrets for machine-local env vars (never overwritten)
  ansible.builtin.copy:
    content: "# Machine-local secrets and env vars. NOT tracked by git.\n# e.g. export SOME_API_KEY=...\n"
    dest: "{{ ansible_facts.env.HOME }}/.secrets"
    mode: "0600"
    force: false

- name: Make /bin/bash the login shell
  ansible.builtin.command:
    cmd: "chsh -s /bin/bash {{ ansible_facts.env.USER }}"
  become: true
  # As the target user, `chsh` always prompts for the account password (a
  # PAM check, not sudo) even with no tty to answer it — it fails instead of
  # hanging. Run as root instead: root can change any user's shell with no
  # password prompt at all. bootstrap.sh already grants this run passwordless
  # sudo, so `become` here needs no extra credentials.
  when: ansible_facts.env.SHELL != "/bin/bash"
  changed_when: true
