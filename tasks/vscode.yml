---
# visual-studio-code cask is installed in packages.yml.

- name: Locate the `code` CLI
  ansible.builtin.stat:
    path: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
  register: code_cli

- name: Install VS Code extensions
  ansible.builtin.command:
    cmd: "'{{ code_cli.stat.path }}' --install-extension {{ item }} --force"
  loop: "{{ vscode_extensions }}"
  when: code_cli.stat.exists
  changed_when: true

- name: Ensure VS Code User settings directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/Library/Application Support/Code/User"
    state: directory
    mode: "0755"

- name: Deploy VS Code settings.json
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/vscode/settings.json"
    dest: "{{ ansible_facts.env.HOME }}/Library/Application Support/Code/User/settings.json"
    mode: "0644"
    backup: true
