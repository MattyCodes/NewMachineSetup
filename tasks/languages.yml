---
# python, rbenv, ruby-build and nvm are installed as formulae in packages.yml.
# This file just makes them usable.

- name: Ensure NVM_DIR exists
  ansible.builtin.file:
    path: "{{ ansible_facts.env.HOME }}/.nvm"
    state: directory
    mode: "0755"

- name: Install a default Node version via nvm
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -e
      export NVM_DIR="{{ ansible_facts.env.HOME }}/.nvm"
      source "$(brew --prefix nvm)/nvm.sh"
      node_version="{{ node_version }}"
      nvm install "$node_version"
      # `nvm alias` doesn't accept install-only flags like --lts/--lts=<name>
      # (unlike `nvm install`) — it wants a plain tag such as "lts/*" or
      # "lts/<name>". Translate; pass anything else (a version, "node", an
      # explicit lts/<codename>) straight through.
      case "$node_version" in
        --lts=*) alias_target="lts/${node_version#--lts=}" ;;
        --lts)   alias_target="lts/*" ;;
        *)       alias_target="$node_version" ;;
      esac
      nvm alias default "$alias_target"
    creates: "{{ ansible_facts.env.HOME }}/.nvm/alias/default"
  when: node_version | length > 0

- name: Install a global Ruby version via rbenv
  ansible.builtin.shell:
    executable: /bin/bash
    cmd: |
      set -e
      eval "$(rbenv init - bash)"
      rbenv install --skip-existing {{ ruby_version }}
      rbenv global {{ ruby_version }}
    creates: "{{ ansible_facts.env.HOME }}/.rbenv/versions/{{ ruby_version }}"
  when: ruby_version | length > 0
